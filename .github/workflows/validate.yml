name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate repository harness
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'scripts/install.ps1',
            'scripts/install-copilot-skills.ps1',
            'scripts/install-copilot-guardrails.ps1',
            'scripts/check-ja-source-commits.ps1',
            'scripts/test-command-policy.ps1',
            'scripts/test-copilot-skill-installer.ps1',
            'scripts/test-ja-source-metadata.ps1',
            'scripts/validate-development-workflow.ps1',
            'skills/codex-clean-local-state/scripts/wait_and_execute.ps1',
            'skills/codex-claude-code-reviewer/scripts/invoke-claude-review.ps1'
          )

          foreach ($script in $scripts) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$null,
              [ref]$errors
            ) > $null

            if ($errors) {
              $errors | ForEach-Object { "${script}: $($_.Message)" }
              throw "PowerShell parse failed: $script"
            }
          }

      - name: Validate installer dry runs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $codexHome = Join-Path $env:RUNNER_TEMP 'codex-home'
          New-Item -ItemType Directory -Path $codexHome -Force | Out-Null

          ./scripts/install.ps1 -CodexHome $codexHome -WhatIf
          ./scripts/install.ps1 -CodexHome $codexHome -InstallConfig -WhatIf

      - name: Validate development workflow invariants
        shell: pwsh
        run: ./scripts/validate-development-workflow.ps1

      - name: Validate Codex local-state cleanup safety
        shell: pwsh
        run: python -m unittest -v test_cleanup_stale_codex_sessions.py
        working-directory: skills/codex-clean-local-state/scripts

      - name: Validate local Skill promotion safety
        shell: pwsh
        run: python -m unittest -v test_audit_skill_promotion.py
        working-directory: skills/codex-promote-local-skill/scripts

      - name: Install pinned Codex CLI for execpolicy checks
        run: npm install --global @openai/codex@0.121.0

      - name: Validate command policy decisions
        shell: pwsh
        run: ./scripts/test-command-policy.ps1

      - name: Validate Copilot workflow packaging and lifecycle
        shell: pwsh
        run: ./scripts/test-copilot-skill-installer.ps1

      - name: Validate Japanese reference metadata
        shell: pwsh
        run: ./scripts/check-ja-source-commits.ps1

      - name: Validate Japanese metadata update lifecycle
        shell: pwsh
        run: ./scripts/test-ja-source-metadata.ps1
